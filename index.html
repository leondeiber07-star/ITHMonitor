<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<!-- Evitar congelamiento de caché en teléfonos -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Calculadora ITH</title>
<style>
  :root {
    --bg: #f2f4f1;
    --card: #ffffff;
    --ink: #1b2620;
    --muted: #66746b;
    --line: #dde3de;
    --brand: #1f4d3a;
    --brand-ink: #ffffff;
    --whatsapp: #25d366;
    --whatsapp-ink: #ffffff;
    --err: #b3261e;
    --lv0: #2f7d4f;
    --lv1: #f2b705;
    --lv2: #e8710a;
    --lv3: #c0392b;
    --focus: #2b7de9;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }

  .bar {
    background: var(--brand); color: var(--brand-ink);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 22px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .bar h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }
  .bar p { margin: 2px 0 0; font-size: 0.85rem; opacity: .85; }
  .farm-badge {
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  /* Contexto operativo: Galpón y Turno */
  .meta-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: -30px; margin-bottom: 12px;
  }
  .meta-card { padding: 10px 14px; background: var(--card); box-shadow: 0 4px 12px rgba(20,40,30,.06); }
  .meta-card label { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .meta-card select {
    width: 100%; border: 0; outline: 0; background: transparent; font: inherit;
    font-size: 0.95rem; font-weight: 600; color: var(--ink); padding: 4px 0 0; cursor: pointer;
  }

  /* Entradas */
  .inputs { display: grid; grid-template-columns: 1fr 1fr; box-shadow: 0 6px 18px rgba(20,40,30,.08); }
  .field { padding: 12px 16px 10px; border-radius: 14px; }
  .field + .field { border-left: 1px solid var(--line); border-radius: 0 14px 14px 0; }
  .field:first-child { border-radius: 14px 0 0 14px; }
  .field:focus-within { background: #f7faf8; box-shadow: inset 0 0 0 2px var(--brand); }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); }
  .row { display: flex; align-items: baseline; gap: 6px; }
  .field input {
    min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 2.1rem; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; padding: 2px 0 0;
  }
  .field input::placeholder { color: #b7c1ba; font-weight: 500; }
  .unit { font-size: 0.95rem; color: var(--muted); }
  .field.invalid { box-shadow: inset 0 0 0 2px var(--err); }
  .err { min-height: 1.3em; margin: 8px 4px 0; font-size: 0.85rem; color: var(--err); }

  /* Resultado */
  .result { margin-top: 6px; padding: 18px 18px 20px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .lbl { font-size: 0.8rem; color: var(--muted); }
  .val { font-size: 4.6rem; font-weight: 300; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 0.95rem; font-weight: 650;
    background: var(--chip, var(--muted)); color: var(--chip-ink, #fff);
  }
  .chip[hidden] { display: none; }
  .result[data-lv="0"] { --chip: var(--lv0); --chip-ink: #fff; }
  .result[data-lv="1"] { --chip: var(--lv1); --chip-ink: #2a2000; }
  .result[data-lv="2"] { --chip: var(--lv2); --chip-ink: #2a1300; }
  .result[data-lv="3"] { --chip: var(--lv3); --chip-ink: #fff; }

  .gauge { position: relative; margin: 20px 0 22px; }
  .bars { display: flex; gap: 3px; height: 10px; }
  .bars span { border-radius: 5px; }
  .bars span:nth-child(1) { flex: 10; background: var(--lv0); }
  .bars span:nth-child(2) { flex: 6;  background: var(--lv1); }
  .bars span:nth-child(3) { flex: 6;  background: var(--lv2); }
  .bars span:nth-child(4) { flex: 18; background: var(--lv3); }
  .tick { position: absolute; top: 16px; transform: translateX(-50%); font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pin {
    position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px;
    background: var(--ink); box-shadow: 0 0 0 2px var(--card); transition: left .25s ease;
  }
  .pin[hidden] { display: none; }
  .act { margin: 0; font-size: 0.92rem; color: var(--muted); }

  /* Acciones */
  .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .btn-wp {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px;
    border: 0; border-radius: 12px; font: inherit; font-size: 1.02rem; font-weight: 650; cursor: pointer;
    background: var(--whatsapp); color: var(--whatsapp-ink); text-decoration: none;
  }
  .btn-wp:disabled { opacity: .35; cursor: not-allowed; }
  .btn-wp:not(:disabled):active { transform: translateY(1px); }

  .copy {
    display: block; width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--ink);
  }
  .copy:disabled { opacity: .35; cursor: not-allowed; }
  .ok { min-height: 1.3em; margin: 8px 4px 0; font-size: 0.85rem; color: var(--muted); text-align: center; }

  /* Leyenda */
  .legend { margin-top: 10px; overflow: hidden; }
  .legend h2 { margin: 0; padding: 12px 16px 6px; font-size: 0.8rem; font-weight: 500; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  td { padding: 10px 16px; border-top: 1px solid var(--line); }
  td.dot { width: 34px; padding-right: 0; }
  td.dot i { display: block; width: 12px; height: 12px; border-radius: 50%; }
  td.rg { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  tr.on td { background: #f4f7f5; font-weight: 650; }
  tr.on td.rg { color: var(--ink); }

  /* Modal de bienvenida / configuración */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 999;
  }
  .modal-overlay[hidden] { display: none; }
  .modal { background: var(--card); padding: 24px; border-radius: 16px; max-width: 360px; width: 100%; text-align: center; }
  .modal h3 { margin: 0 0 8px; font-size: 1.2rem; }
  .modal p { margin: 0 0 16px; font-size: 0.9rem; color: var(--muted); }
  .modal input {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 1rem; margin-bottom: 16px; outline: none;
  }
  .modal input:focus { border-color: var(--brand); }
  .modal button {
    width: 100%; padding: 12px; background: var(--brand); color: #fff;
    border: 0; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1613; --card: #16201b; --ink: #e9efeb; --muted: #93a39a; --line: #27342d; --brand: #2f7d4f; --err: #ff8a80;
    }
    :root:not([data-theme="light"]) .field:focus-within,
    :root:not([data-theme="light"]) tr.on td { background: #1c2922; }
    :root:not([data-theme="light"]) .meta-card select { color: #e9efeb; }
  }
</style>
</head>
<body>

<header class="bar">
  <div>
    <h1>Calculadora ITH</h1>
    <p>Control de ambiente avícola</p>
  </div>
  <button type="button" class="farm-badge" id="btnEditFarm" title="Editar nombre de la granja">
    <span id="farmNameLabel">Granja Avícola</span> ✏️
  </button>
</header>

<main>
  <!-- Sección para identificar el Galpón y Momento -->
  <div class="meta-grid">
    <div class="card meta-card">
      <label for="galpon">Galpón</label>
      <select id="galpon">
        <option value="Galpón 6">Galpón 6</option>
        <option value="Galpón 7">Galpón 7</option>
        <option value="Galpón 8">Galpón 8</option>
        <option value="Galpón General">General</option>
      </select>
    </div>
    <div class="card meta-card">
      <label for="turno">Turno</label>
      <select id="turno">
        <option value="Mañana">Mañana</option>
        <option value="Mediodía">Mediodía</option>
        <option value="Tarde">Tarde</option>
        <option value="Noche">Noche</option>
      </select>
    </div>
  </div>

  <section class="card inputs" aria-label="Datos de entrada">
    <div class="field" id="fT">
      <label for="t">Temperatura</label>
      <div class="row">
        <input id="t" type="text" inputmode="decimal" autocomplete="off" placeholder="25,9" aria-describedby="err">
        <span class="unit">°C</span>
      </div>
    </div>
    <div class="field" id="fH">
      <label for="h">Humedad</label>
      <div class="row">
        <input id="h" type="text" inputmode="decimal" autocomplete="off" placeholder="66" aria-describedby="err">
        <span class="unit">%</span>
      </div>
    </div>
  </section>
  <p class="err" id="err" role="alert"></p>

  <section class="card result" id="res" data-lv="" aria-live="polite">
    <div class="top">
      <div>
        <div class="lbl">ITH</div>
        <div class="val" id="val">--</div>
      </div>
      <span class="chip" id="chip" hidden></span>
    </div>
    <div class="gauge" aria-hidden="true">
      <div class="bars"><span></span><span></span><span></span><span></span></div>
      <span class="tick" style="left:25%">70</span>
      <span class="tick" style="left:40%">76</span>
      <span class="tick" style="left:55%">82</span>
      <div class="pin" id="pin" hidden></div>
    </div>
    <p class="act" id="act">Ingrese temperatura y humedad para calcular.</p>
  </section>

  <div class="btn-group">
    <button type="button" class="btn-wp" id="btnWp" disabled>
      <span>📲 Compartir por WhatsApp</span>
    </button>
    <button type="button" class="copy" id="copy" disabled>📋 Copiar al portapapeles</button>
  </div>
  <p class="ok" id="ok" role="status"></p>

  <section class="card legend">
    <h2>Escala de niveles</h2>
    <table id="tbl" aria-label="Rangos de la escala"></table>
  </section>
</main>

<!-- Modal para pedir el nombre de la avícola por primera vez -->
<div class="modal-overlay" id="farmModal" hidden>
  <div class="modal">
    <h3>Configuración Inicial</h3>
    <p>Ingresa el nombre de la avícola o granja para tus reportes:</p>
    <input type="text" id="farmInput" placeholder="Ej: Granja Avícola 5">
    <button type="button" id="btnSaveFarm">Guardar y Continuar</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var LEVELS = [
    { max: 69, name: "Confort", range: "menor a 70", dot: "🟢",
      act: "No se requiere acción. Buen momento para preparar la temporada cálida." },
    { max: 75, name: "Alerta", range: "70 a 75", dot: "🟡",
      act: "Reducir el estrés por calor: aumentar ventilación y velocidad de ventiladores, usar nebulizadores. Vigilar a las aves y verificar bebederos y ventilación." },
    { max: 81, name: "Peligro", range: "76 a 81", dot: "🟠",
      act: "Actuar de inmediato: más ventilación, enfriamiento evaporativo, ajustar nutrientes de la dieta, purgar tuberías con agua fría y maximizar el enfriamiento nocturno." },
    { max: Infinity, name: "Emergencia", range: "mayor a 81", dot: "🔴",
      act: "Evitar manipular las aves (traslados, vacunación). No alimentar en las horas más calientes. Reducir la intensidad de la luz." }
  ];
  var DOT_VARS = ["--lv0", "--lv1", "--lv2", "--lv3"];
  var G_MIN = 60, G_SPAN = 40;

  var $ = function (id) { return document.getElementById(id); };
  var tIn = $("t"), hIn = $("h"), copyBtn = $("copy"), wpBtn = $("btnWp");
  var galponSel = $("galpon"), turnoSel = $("turno");
  var farmModal = $("farmModal"), farmInput = $("farmInput"), btnSaveFarm = $("btnSaveFarm");
  var farmLabel = $("farmNameLabel"), btnEditFarm = $("btnEditFarm");

  var current = null;

  // --- Manejo del nombre de la granja (localStorage) ---
  function getFarmName() {
    return localStorage.getItem("ith_farm_name") || "";
  }

  function setFarmName(name) {
    var val = name.trim() || "Granja Avícola";
    localStorage.setItem("ith_farm_name", val);
    farmLabel.textContent = val;
  }

  function checkFirstRun() {
    var saved = getFarmName();
    if (!saved) {
      farmModal.hidden = false;
      farmInput.focus();
    } else {
      farmLabel.textContent = saved;
    }
  }

  btnSaveFarm.addEventListener("click", function () {
    if (farmInput.value.trim() !== "") {
      setFarmName(farmInput.value);
      farmModal.hidden = true;
    }
  });

  btnEditFarm.addEventListener("click", function () {
    farmInput.value = getFarmName();
    farmModal.hidden = false;
    farmInput.focus();
  });

  // --- Funciones matemáticas y formateo ---
  function parse(v) {
    var s = String(v).trim().replace(",", ".");
    if (s === "" || !/^-?\d*\.?\d+$|^-?\d+\.$/.test(s)) return null;
    var n = parseFloat(s);
    return isFinite(n) ? n : null;
  }

  function ith(t, h) {
    var raw = 0.81 * t + (h / 100) * (t - 14.4) + 46.4;
    return Math.ceil(Number(raw.toFixed(9)));
  }

  function levelIndex(v) {
    for (var i = 0; i < LEVELS.length; i++) if (v <= LEVELS[i].max) return i;
    return LEVELS.length - 1;
  }

  function buildReportText(c) {
    var farm = getFarmName() || "Granja Avícola";
    var fecha = new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
    var hora = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });

    return [
      "🐔 *" + farm.toUpperCase() + "*",
      "📍 *" + galponSel.value + "* | Turno: " + turnoSel.value,
      "📅 " + fecha + " - " + hora,
      "──────────────────",
      "🌡️ *Temperatura:* " + c.tTxt + " °C",
      "💧 *Humedad:* " + c.hTxt + " %",
      "📊 *ITH Calculado:* *" + c.v + "*",
      "⚠️ *Nivel:* " + c.lv.name + " " + c.lv.dot,
      "──────────────────",
      "📋 *Acción recomendada:*",
      c.lv.act
    ].join("\n");
  }

  function drawTable(active) {
    var html = "";
    for (var i = 0; i < LEVELS.length; i++) {
      html += '<tr class="' + (i === active ? "on" : "") + '">' +
        '<td class="dot"><i style="background:var(' + DOT_VARS[i] + ')"></i></td>' +
        "<td>" + LEVELS[i].name + '</td><td class="rg">' + LEVELS[i].range + "</td></tr>";
    }
    $("tbl").innerHTML = html;
  }

  function placePin(v) {
    var pct = Math.max(1, Math.min(99, ((v + 0.5 - G_MIN) / G_SPAN) * 100));
    $("pin").style.left = pct + "%";
  }

  function render() {
    var tRaw = tIn.value.trim(), hRaw = hIn.value.trim();
    var t = parse(tRaw), h = parse(hRaw);
    var msg = "", tBad = false, hBad = false;

    if (tRaw !== "" && t === null) { msg = "Temperatura no válida."; tBad = true; }
    else if (tRaw !== "" && (t < -10 || t > 60)) { msg = "Temperatura fuera de rango (-10 a 60 °C)."; tBad = true; }
    if (hRaw !== "" && h === null) { msg = msg || "Humedad no válida."; hBad = true; }
    else if (hRaw !== "" && (h < 0 || h > 100)) { msg = msg || "Humedad fuera de rango (0 a 100 %)."; hBad = true; }

    $("fT").classList.toggle("invalid", tBad);
    $("fH").classList.toggle("invalid", hBad);
    $("err").textContent = msg;
    $("ok").textContent = "";

    var res = $("res");
    if (t === null || h === null || tBad || hBad) {
      current = null;
      copyBtn.disabled = true;
      wpBtn.disabled = true;
      res.setAttribute("data-lv", "");
      $("val").textContent = "--";
      $("chip").hidden = true;
      $("pin").hidden = true;
      $("act").textContent = "Ingrese temperatura y humedad para calcular.";
      drawTable(-1);
      return;
    }

    var v = ith(t, h);
    var i = levelIndex(v);
    var lv = LEVELS[i];
    current = { tTxt: tRaw, hTxt: hRaw, v: v, lv: lv };
    copyBtn.disabled = false;
    wpBtn.disabled = false;
    res.setAttribute("data-lv", String(i));
    $("val").textContent = String(v);
    $("chip").textContent = lv.name;
    $("chip").hidden = false;
    $("pin").hidden = false;
    placePin(v);
    $("act").textContent = lv.act;
    drawTable(i);
  }

  // --- Compartir WhatsApp ---
  wpBtn.addEventListener("click", function () {
    if (!current) return;
    var text = buildReportText(current);
    var url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
    window.open(url, "_blank");
  });

  // --- Copiar Portapapeles ---
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  copyBtn.addEventListener("click", function () {
    if (!current) return;
    var text = buildReportText(current);
    var done = function (ok) { $("ok").textContent = ok ? "Reporte copiado listo para pegar." : "No se pudo copiar."; };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  });

  tIn.addEventListener("input", render);
  hIn.addEventListener("input", render);
  checkFirstRun();
  render();
})();
</script>
</body>
</html>
